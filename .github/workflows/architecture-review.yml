name: InfraCanvas architecture review

on:
  pull_request_target:
    paths:
      - "infracanvas.architecture.json"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: architecture-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-intelligence:
    name: Architecture Change Intelligence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read snapshots as untrusted data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const limit = 5 * 1024 * 1024;
            async function writeSnapshot(ref, destination) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "infracanvas.architecture.json",
                  ref,
                });
                if (Array.isArray(response.data) || response.data.type !== "file") {
                  throw new Error("Architecture snapshot path is not a file.");
                }
                const contents = Buffer.from(response.data.content, "base64");
                if (contents.byteLength > limit) throw new Error("Architecture snapshot exceeds 5 MB.");
                fs.writeFileSync(path.join(process.env.RUNNER_TEMP, destination), contents);
              } catch (error) {
                if (error.status === 404) return;
                throw error;
              }
            }
            await writeSnapshot(context.payload.pull_request.base.sha, "architecture-base.json");
            await writeSnapshot(context.payload.pull_request.head.sha, "architecture-head.json");

      - name: Generate architecture review
        run: npm run review:architecture -- --base "${RUNNER_TEMP}/architecture-base.json" --head "${RUNNER_TEMP}/architecture-head.json" --out architecture-review

      - name: Add review to the workflow summary
        if: always()
        run: cat architecture-review/report.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infracanvas-architecture-review
          path: architecture-review
          if-no-files-found: error
          retention-days: 14

      - name: Create or update the pull request review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- infracanvas-change-intelligence -->";
            const body = fs.readFileSync("architecture-review/report.md", "utf8").slice(0, 60000);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
